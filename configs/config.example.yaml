server:
  api_addr: ":8090"
  metrics_addr: ":9090"

matcher:
  symbol: "BTCUSDT"
  price_precision: 8
  quantity_precision: 8

# Real-time market data feed that backs the trading terminal.
# Public streams only: no API key is required.
market:
  enabled: true
  provider: "binance"
  ws_url: "wss://stream.binance.com:9443"
  symbol: "BTCUSDT"       # empty falls back to matcher.symbol
  depth_levels: 20        # 5, 10 or 20
  depth_speed: "100ms"    # 100ms or 1000ms
  kline_interval: "1m"
  reconnect_min_seconds: 1
  reconnect_max_seconds: 30
  store_trade_cap: 200
  store_kline_cap: 1000

pipeline:
  inbound_capacity: 1048576
  outbound_capacity: 1048576

# Optional live strategy. Only single-symbol strategies run live today
# (market_maker, noop). Requires risk.enabled and market.enabled: the strategy
# consumes the live book and its orders are risk-checked and attributed by name.
strategy:
  enabled: false
  name: "market_maker"
  account_id: 1
  symbol: ""                # empty falls back to matcher.symbol
  timer_seconds: 5
  submit_timeout_millis: 2000
  max_order_rate: 20          # accepted orders per second, 0 = unlimited
  max_open_orders: 4          # resting orders per strategy
  max_panics: 3
  params:
    half_spread_bps: "5"
    order_qty: "10000000"     # lots, already scaled by quantity_precision
    inventory_limit: "0"      # absolute position cap in lots, 0 = unlimited
    min_requote_bps: "1"

# Order routing between execution venues. "paper" is always available;
# "binance" exists when execution.binance.enabled is true. An empty
# default_venue falls back to "paper".
routing:
  default_venue: "paper"
  symbol_venues: {}
  # Example: pin a symbol explicitly (the venue must be configured).
  # symbol_venues:
  #   BTCUSDT: "paper"

# External execution venues. Credentials come from BINANCE_API_KEY and
# BINANCE_API_SECRET; never place secrets in this file.
execution:
  binance:
    enabled: false
    base_url: "https://testnet.binance.vision"
    ws_url: "wss://stream.testnet.binance.vision"
    account_id: 0
    recv_window_seconds: 5
    reconnect_min_seconds: 1
    reconnect_max_seconds: 10

# Risk checks. Disabled by default; zero/empty values disable individual checks
# when enabled.
# Limits use human-readable units and are converted to engine units at startup:
#   max_order_qty / max_position: base quantity (e.g. BTC)
#   max_notional / max_daily_loss: quote currency (e.g. USDT)
# max_position is evaluated against the in-memory position ledger, which is fed
# from execution reports on the matching goroutine.
risk:
  enabled: false
  symbol_whitelist: []
  max_order_qty: 0
  max_notional: 0
  price_band_bps: 0        # reference price comes from the live market mid
  max_orders_per_window: 0
  window_seconds: 0
  max_position: 0

  # Post-trade monitoring and strategy breakers. When a check trips, new orders
  # are rejected with the corresponding code and a risk event is published.
  intraday:
    max_cancel_ratio_bps: 0   # 8000 means 80% cancels over the window
    cancel_window_seconds: 0
    min_cancel_samples: 5     # avoid tripping on the first cancel
    max_open_orders: 0
    max_daily_loss: 0
    max_drawdown_bps: 0
    cooldown_seconds: 0
    resume_auto: false        # false escalates a breach to a permanent halt

storage:
  postgres_enabled: false
  postgres_dsn: "postgres://user:pass@localhost:5432/trading?sslmode=disable"
  clickhouse_enabled: false
  clickhouse_url: "http://127.0.0.1:8123"
  clickhouse_database: "market"
  clickhouse_table: "trade_ticks"
  clickhouse_timeout_seconds: 5
  position_snapshot_seconds: 5

websocket:
  buffer_size: 1024