# Backtest configuration.
#
# Units are the same as the matching engine:
#   price    = integer ticks (matcher.price_precision)
#   quantity = integer lots  (matcher.quantity_precision)
#   cash, pnl, fees = ticks * lots
#
# The data file is one JSON object per line, see internal/hft/backtest/source.go.
backtest:
  initial_cash: 1000000000000 # 10000.0 * 1e8 in ticks*lots units
  maker_fee_bps: 2
  taker_fee_bps: 5
  slippage_bps: 1             # applied to aggressive fills only
  participation_bps: 5000     # max share of a trade/level one order may take
  queue_position_bps: 5000    # 0 = front of queue, 10000 = never filled at touch
  max_levels: 10              # max book levels swept by one aggressive order
  seed: 42                    # same data + same seed => identical report
  bar_seconds: 60             # bar width for Sharpe and the equity curve
  event_timer_millis: 60000   # OnTimer cadence in replay time

  # Runtime limits applied by the strategy sandbox. Zero disables a limit.
  max_order_rate: 0
  max_open_orders: 4
  max_panics: 3

data:
  path: ./internal/hft/backtest/testdata/sample.jsonl

strategy:
  name: market_maker         # noop | market_maker | stat_arb
  params:
    symbol: BTCUSDT
    half_spread_bps: "2"
    order_qty: "10000000"
    inventory_limit: "0"
    min_requote_bps: "1"

report:
  path: ./out/backtest-report.json
  markdown: ./out/backtest-report.md
